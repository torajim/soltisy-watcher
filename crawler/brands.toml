# 피어 (현대백화점 스트리트 편집숍) — 더현대Hi 브랜드관
[[brand]]
id = "peer"
name = "PEER"
source = "thehyundai"
brand_code = "M00021"
sect_id = 547338
limit = 60

[brand.men]
sex = "men"

[brand.women]
sex = "women"

# 자라는 GitHub 서버에서 상품 JSON 요청이 403(봇 차단)으로 막혀 바로가기만 둔다 (2026-11-22 확인).
# 막힘이 풀리면 아래처럼 바꾸면 된다 (source = "zara" 수집기는 남겨 둠):
#   source = "zara" / limit = 60 / [brand.men] category_id = 2544454 / [brand.women] category_id = 2546081
[[brand]]
id = "zara"
name = "ZARA"
source = "link"
url = "https://www.zara.com/kr/ko/"

# 유니클로 신상품순
[[brand]]
id = "uniqlo"
name = "UNIQLO"
source = "uniqlo"
limit = 60

[brand.men]
gender_path = "57893"

[brand.women]
gender_path = "57892"

