# 수집할 브랜드 목록. 브랜드를 추가하려면 [[brand]] 블록을 하나 더 적으면 됩니다.
#
# source = "thehandsome" : 더한섬닷컴 입점 브랜드. brand_no 는 더한섬 브랜드 코드
#                          (https://www.thehandsome.com/api/display/1/ko/brand/getDispCtgBrandList 에서 확인)
# source = "cafe24"      : Cafe24 기반 자체몰. new_category_no 는 '신상품' 카테고리 번호
#                          (목록 URL 의 /product/list.html?cate_no=XX)
# source = "ssf"         : SSF SHOP 브랜드관. 브랜드관 목록 URL 의 경로·dspCtgryNo·brandShopNo·brndShopId
# source = "prada"       : prada.com 카테고리 페이지 (category_path)
# source = "link"        : 수집하지 않음. 앱 상단에 url 로 가는 바로가기 칩만 표시
#                          (자동 수집을 막아 둔 사이트용)

[[brand]]
id = "solidhomme"
name = "SOLID HOMME"
source = "cafe24"
base_url = "https://www.solidhomme.com"
new_category_no = 83
limit = 60

[[brand]]
id = "timehomme"
name = "TIME HOMME"
source = "thehandsome"
brand_no = "BR06"
limit = 60

[[brand]]
id = "systemhomme"
name = "SYSTEM HOMME"
source = "thehandsome"
brand_no = "BR07"
limit = 60

# 편집숍: 신상품 카테고리가 없어 '전체보기'(255)를 신상품순(sort_method=5)으로 정렬해 가져온다
[[brand]]
id = "sculpstore"
name = "SCULP STORE"
source = "cafe24"
base_url = "https://www.sculpstore.com"
new_category_no = 255
sort_method = 5
limit = 60

# 비이커 남성 신상품 (SSF SHOP)
[[brand]]
id = "beaker"
name = "BEAKER"
source = "ssf"
shop_path = "BEAKER/MEN"
category_no = "SFMA31A42"
brand_shop_no = "BDMA09"
brand_shop_id = "MCBR"
limit = 60

# 프라다 남성 신상품 (의류·신발·가방·액세서리 전체)
[[brand]]
id = "prada"
name = "PRADA"
source = "prada"
category_path = "/mens/new-in/c/10182KR.html"
limit = 60

# 랄프로렌 공식몰은 봇 차단(Akamai)으로 자동 수집이 불가해 바로가기만 둔다.
[[brand]]
id = "polo"
name = "POLO"
source = "link"
url = "https://www.ralphlauren.co.kr/men"

[[brand]]
id = "rrl"
name = "RRL"
source = "link"
url = "https://www.ralphlauren.co.kr/en/men/rrl?country=korea"

# 구찌는 이 환경에서 접속·robots.txt 확인이 안 돼 바로가기만 둔다 (남성 신상품 페이지 주소를 알면 바꿔주세요)
[[brand]]
id = "gucci"
name = "GUCCI"
source = "link"
url = "https://www.gucci.com/kr/ko/"
