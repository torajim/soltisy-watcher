name: Crawl & Deploy

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 3시간마다 (UTC 기준 매 3시간 정각 +17분)
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.check.outputs.failed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false  # 의존성·lock 파일이 없어 캐시할 것이 없음

      - name: Install crawler
        working-directory: crawler
        run: pip install -r requirements.txt

      - name: Test crawler
        working-directory: crawler
        run: pytest -q

      - name: Test web app
        working-directory: site
        run: npm test

      # 한 브랜드가 실패해도 이전 배포본의 그 브랜드 데이터를 유지하기 위해 먼저 받아온다
      - name: Fetch previous data
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p site/data
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/data/products.json"
          curl -fsSL "$url" -o site/data/products.json || rm -f site/data/products.json

      - name: Crawl
        if: github.event_name != 'pull_request'
        working-directory: crawler
        run: python -m watcher

      - name: Check brand results
        id: check
        if: github.event_name != 'pull_request'
        run: |
          failed=$(python3 -c "import json; d=json.load(open('site/data/products.json')); print(', '.join(b['name'] for b in d['brands'] if not b['ok']))")
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          python3 -c "import json; d=json.load(open('site/data/products.json')); print('| 브랜드 | 결과 | 상품 수 |\n|---|---|---|'); [print(f\"| {b['name']} | {'✅' if b['ok'] else '❌ 실패 (이전 데이터 유지)'} | {b['count']} |\") for b in d['brands']]" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # 수집 실패 시 저장소 주인에게 할당된 이슈를 만들어 GitHub 이메일 알림이 가게 한다.
  # 이미 열린 알림 이슈가 있으면 댓글을 달고, 모든 브랜드가 정상으로 돌아오면 자동으로 닫는다.
  notify:
    needs: [build, deploy]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        env:
          FAILED: ${{ needs.build.outputs.failed }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = "crawl-failure";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const failed = process.env.FAILED;
            const buildFailed = process.env.BUILD_RESULT !== "success";
            const deployFailed = process.env.DEPLOY_RESULT !== "success";

            const { data: open } = await github.rest.issues.listForRepo({ owner, repo, labels: label, state: "open" });

            if (!failed && !buildFailed && !deployFailed) {
              for (const issue of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `✅ 모든 브랜드 수집이 정상으로 돌아왔어요. ([실행 기록](${runUrl}))` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: "closed", state_reason: "completed" });
              }
              return;
            }

            let reason;
            if (failed) reason = `수집 실패 브랜드: **${failed}** (앱에는 직전 데이터를 계속 보여줘요)`;
            else if (buildFailed) reason = "빌드 단계(테스트 · 수집 · Pages 설정 중 하나)가 실패해서 이번 업데이트가 배포되지 않았어요. 앱은 이전 버전 그대로예요. 실패한 단계는 실행 기록에서 확인하세요.";
            else reason = "GitHub Pages 배포가 실패했어요.";
            const body = `${reason}\n\n[실행 기록 보기](${runUrl})`;

            if (open.length) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open[0].number, body });
            } else {
              try { await github.rest.issues.createLabel({ owner, repo, name: label, color: "d73a4a" }); } catch (e) { /* 이미 있음 */ }
              await github.rest.issues.create({ owner, repo, title: "⚠️ 신상품 수집 실패", body, labels: [label], assignees: [owner] });
            }
            core.setFailed(reason);
