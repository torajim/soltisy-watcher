# 수집할 브랜드 목록. 브랜드를 추가하려면 [[brand]] 블록을 하나 더 적으면 됩니다.
#
# source = "thehandsome" : 더한섬닷컴 입점 브랜드. brand_no 는 더한섬 브랜드 코드
#                          (https://www.thehandsome.com/api/display/1/ko/brand/getDispCtgBrandList 에서 확인)
# source = "cafe24"      : Cafe24 기반 자체몰. new_category_no 는 '신상품' 카테고리 번호
#                          (목록 URL 의 /product/list.html?cate_no=XX)
# source = "ssf"         : SSF SHOP 브랜드관. 브랜드관 목록 URL 의 경로·dspCtgryNo·brandShopNo·brndShopId
# source = "prada"       : prada.com 카테고리 페이지 (category_path)
# source = "zara"        : zara.com/kr 카테고리 번호 (category_id, /kr/ko/categories?ajax=true 에서 확인)
# source = "uniqlo"      : uniqlo.com/kr 성별 경로 id (gender_path, MEN 57893 / WOMEN 57892)
# source = "thehyundai"  : 더현대Hi 브랜드관. brand_code(검색 targetCode)·sect_id(브랜드관 번호)·sex(men/women)
#
# 성별: 상품마다 men / women 을 붙여 앱 설정(남성·여성·전체)으로 걸러 본다.
#   gender = "women"         : 브랜드 전체가 한 성별일 때 (생략하면 "men")
#   [brand.men] / [brand.women] : 남녀 목록이 따로 있는 사이트. 각 표의 값으로 공통 설정을 덮어써
#                              성별마다 따로 수집한다 (limit 도 성별마다 적용)
#   더한섬은 상품의 첫 전시 카테고리('남성'/'여성')를 우선한다.
# source = "link"        : 수집하지 않음. 상품이 없으므로 앱 상단 탭에도 나오지 않는다
#                          (자동 수집을 막아 둔 사이트를 기록해 두는 용도)

[[brand]]
id = "solidhomme"
name = "SOLID HOMME"
source = "cafe24"
base_url = "https://www.solidhomme.com"
new_category_no = 83
limit = 60

[[brand]]
id = "timehomme"
name = "TIME HOMME"
source = "thehandsome"
brand_no = "BR06"
limit = 60

[[brand]]
id = "systemhomme"
name = "SYSTEM HOMME"
source = "thehandsome"
brand_no = "BR07"
limit = 60

# 타임옴므·시스템옴므의 여성 브랜드 (더한섬)
[[brand]]
id = "time"
name = "TIME"
source = "thehandsome"
brand_no = "BR01"
gender = "women"
limit = 60

[[brand]]
id = "system"
name = "SYSTEM"
source = "thehandsome"
brand_no = "BR03"
gender = "women"
limit = 60

# 편집숍: 신상품 카테고리가 없어 '전체보기'(255)를 신상품순(sort_method=5)으로 정렬해 가져온다
[[brand]]
id = "sculpstore"
name = "SCULP STORE"
source = "cafe24"
base_url = "https://www.sculpstore.com"
new_category_no = 255
sort_method = 5
limit = 60

# 비이커 남성·여성 신상품 (SSF SHOP)
[[brand]]
id = "beaker"
name = "BEAKER"
source = "ssf"
brand_shop_no = "BDMA09"
brand_shop_id = "MCBR"
limit = 60

[brand.men]
shop_path = "BEAKER/MEN"
category_no = "SFMA31A42"

[brand.women]
shop_path = "BEAKER/WOMEN"
category_no = "SFMA31A41"

# 프라다 남성·여성 신상품 (의류·신발·가방·액세서리 전체)
[[brand]]
id = "prada"
name = "PRADA"
source = "prada"
limit = 40  # 사이트가 ?page= 를 무시해 첫 페이지(현재 40개)만 받을 수 있다

[brand.men]
category_path = "/mens/new-in/c/10182KR.html"

[brand.women]
category_path = "/womens/new-in/c/10111KR.html"

# 톰그레이하운드 (더한섬 편집숍). 남녀 상품이 한 목록에 섞여 있어 상품의 전시 카테고리로 성별을 나눈다.
[[brand]]
id = "tomgreyhound"
name = "TOM GREYHOUND"
source = "thehandsome"
brand_no = "TGTN"
limit = 60

# 코어 (Cafe24 자체몰). 상품 정보 표의 'Detail' 칸 텍스트에서 실측을 읽는다.
[[brand]]
id = "coor"
name = "COOR"
source = "cafe24"
base_url = "https://www.coor.kr"
limit = 60

[brand.men]
new_category_no = 94

[brand.women]
