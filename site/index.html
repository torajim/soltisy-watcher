<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="솔리드옴므 · 타임옴므 · 시스템옴므 · 타임 · 시스템 · 스컬프스토어 · 비이커 · 프라다 남녀 신상품을 한 번에" />
  <title>Soltisy Watcher</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="row">
      <button class="chip brand-trigger" id="openBrands" type="button" aria-haspopup="dialog" aria-label="브랜드 고르기"></button>
      <button class="chip fav-title" id="closeFavorites" type="button" aria-label="찜 모아보기 닫고 피드로 돌아가기" hidden></button>
      <span class="spacer"></span>
      <button class="icon-btn fav-toggle" id="openFavorites" type="button" aria-pressed="false" aria-label="찜 모아보기">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path class="heart" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2Z"/></svg>
        <span class="fav-count" id="favCount" hidden></span>
      </button>
      <button class="icon-btn" id="openSettings" aria-label="설정">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg>
      </button>
    </div>
    <nav class="chips small" id="typeChips" aria-label="종류"></nav>
    <div class="notice" id="brandNotice" role="status" hidden></div>
  </header>

  <main id="feed" class="feed" aria-live="polite">
    <div class="state" id="state">불러오는 중…</div>
  </main>

  <div class="counter" id="counter" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 사이즈 상세 -->
  <dialog class="sheet" id="sizeSheet">
    <form method="dialog" class="sheet-head">
      <h2 id="sizeSheetTitle">사이즈</h2>
      <button class="icon-btn" aria-label="닫기">✕</button>
    </form>
    <div class="sheet-body" id="sizeSheetBody"></div>
  </dialog>

  <!-- 브랜드 고르기 -->
  <dialog class="sheet" id="brandSheet">
    <form method="dialog" class="sheet-head">
      <h2>브랜드</h2>
      <button class="icon-btn" aria-label="닫기">✕</button>
    </form>
    <div class="sheet-body">
      <p class="hint">여러 개를 고를 수 있어요. ALL 을 누르면 선택이 풀려요.</p>
      <div class="brand-grid" id="brandGrid" role="group" aria-label="브랜드"></div>
      <form method="dialog" class="actions">
        <button class="btn primary" id="applyBrands">보기</button>
      </form>
    </div>
  </dialog>

  <!-- 설정 (보기) -->
  <dialog class="sheet" id="settingsSheet">
    <form method="dialog" class="sheet-head">
      <h2>설정</h2>
      <button class="icon-btn" aria-label="닫기">✕</button>
    </form>
    <div class="sheet-body settings">
      <section>
        <h3>보여줄 상품</h3>
        <p class="hint">고르면 바로 적용돼요. 남녀 공용 상품은 양쪽에 모두 나와요.</p>
        <div class="chips segmented" id="genderPicker" role="group" aria-label="성별"></div>
      </section>
    </div>
  </dialog>

  <template id="cardTpl">
    <article class="card">
      <div class="gallery"></div>
      <div class="dots"></div>
      <div class="info">
        <div class="brand"></div>
        <h2 class="name"></h2>
        <div class="price"></div>
        <div class="gone" hidden>지금은 피드에 없는 상품이에요. 찜할 때 정보로 보여드려요.</div>
        <div class="sizes"></div>
        <div class="buttons">
          <button class="btn ghost size-btn" type="button">사이즈</button>
          <button class="btn ghost fav-btn" type="button" aria-pressed="false" aria-label="찜하기" title="찜하기">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path class="heart" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 20.5s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.6a4.3 4.3 0 0 1 7.5 2.7c0 5.6-7.5 10.2-7.5 10.2Z"/></svg>
          </button>
          <button class="btn ghost share-btn" type="button" aria-label="공유하기" title="공유하기">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
          </button>
          <a class="btn primary go" target="_blank" rel="noopener">상품 보러가기 ↗</a>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
