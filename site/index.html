<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="솔리드옴므 · 타임옴므 · 시스템옴므 신상품을 한 번에" />
  <title>Soltisy Watcher</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="row">
      <nav class="chips" id="brandChips" aria-label="브랜드"></nav>
      <button class="icon-btn" id="openSettings" aria-label="내 사이즈 설정">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.4 0-8 2.2-8 5v2h16v-2c0-2.8-3.6-5-8-5Z"/></svg>
      </button>
    </div>
    <nav class="chips small" id="typeChips" aria-label="종류"></nav>
  </header>

  <main id="feed" class="feed" aria-live="polite">
    <div class="state" id="state">불러오는 중…</div>
  </main>

  <div class="counter" id="counter" hidden></div>
  <div class="toast" id="toast" role="status" hidden></div>

  <!-- 사이즈 상세 -->
  <dialog class="sheet" id="sizeSheet">
    <form method="dialog" class="sheet-head">
      <h2 id="sizeSheetTitle">사이즈</h2>
      <button class="icon-btn" aria-label="닫기">✕</button>
    </form>
    <div class="sheet-body" id="sizeSheetBody"></div>
  </dialog>

  <!-- 내 사이즈 설정 -->
  <dialog class="sheet" id="settingsSheet">
    <form method="dialog" class="sheet-head">
      <h2>내 사이즈</h2>
      <button class="icon-btn" aria-label="닫기">✕</button>
    </form>
    <form class="sheet-body settings" id="settingsForm">
      <section>
        <h3>평소 입는 사이즈</h3>
        <p class="hint">브랜드마다 표기가 달라서 여러 개를 쉼표로 적어두면 앞에서부터 맞는 걸 찾아요.<br />예) 상의 <code>100, 48, L</code> · 하의 <code>32, 82</code></p>
        <label>상의 · 아우터<input name="label-top" inputmode="text" autocomplete="off" placeholder="100, 48, L" /></label>
        <label>하의<input name="label-bottom" inputmode="text" autocomplete="off" placeholder="32, 82" /></label>
        <label>신발<input name="label-shoes" inputmode="numeric" autocomplete="off" placeholder="270" /></label>
      </section>
      <section>
        <h3>잘 맞는 옷의 실측 (cm)</h3>
        <p class="hint">가장 잘 맞는 옷을 바닥에 평평하게 놓고 잰 값(단면)을 적어주세요. 상품 실측표와 비교해서 가장 가까운 사이즈를 추천해요. 가슴·어깨(상의), 허리(하의) 중 하나는 꼭 필요해요.</p>
        <div class="grid" id="measureTop"></div>
        <div class="grid" id="measureBottom"></div>
      </section>
      <section>
        <h3>체형 사진 <span class="badge">준비 중</span></h3>
        <p class="hint">전신 사진을 올려두면 상품을 입혀서 보여주는 가상 피팅 기능을 준비하고 있어요.</p>
        <button type="button" class="btn ghost" id="tryonPhoto" disabled>사진 올리기</button>
      </section>
      <div class="actions">
        <button type="button" class="btn ghost" id="resetProfile">초기화</button>
        <button type="submit" class="btn primary">저장</button>
      </div>
    </form>
  </dialog>

  <template id="cardTpl">
    <article class="card">
      <div class="gallery"></div>
      <div class="dots"></div>
      <div class="info">
        <div class="brand"></div>
        <h2 class="name"></h2>
        <div class="price"></div>
        <div class="rec"></div>
        <div class="sizes"></div>
        <div class="buttons">
          <button class="btn ghost size-btn" type="button">사이즈</button>
          <button class="btn ghost tryon-btn" type="button">피팅</button>
          <a class="btn primary go" target="_blank" rel="noopener">상품 보러가기 ↗</a>
        </div>
      </div>
    </article>
  </template>

  <script type="module" src="js/app.js"></script>
</body>
</html>
